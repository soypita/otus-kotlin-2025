openapi: 3.0.4
info:
  title: Bookshelf log models
  description: Log models for logging services of Bookshelf App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
paths: { }

components:
  schemas:
    CommonLogModel:
      title: Общая модель лога
      description: Общая модель лога для всех микросервисов системы
      type: object
      properties:
        messageTime:
          type: string
        logId:
          type: string
        source:
          type: string
        book:
          $ref: '#/components/schemas/BookshelfLogModel'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorLogModel'

    BookshelfLogModel:
      title: Модель лога для микросервиса Bookshelf
      type: object
      properties:
        requestId:
          type: string
        operation:
          $ref: '#/components/schemas/BookshelfLogOperation'
        requestBook:
          $ref: '#/components/schemas/BookLog'
        requestFilter:
          $ref: '#/components/schemas/BookFilterLog'
        responseBook:
          $ref: '#/components/schemas/BookLog'
        responseBooks:
          type: array
          items:
            $ref: '#/components/schemas/BookLog'

    BookshelfLogOperation:
      type: string
      enum:
        - create
        - read
        - update
        - delete
        - search
        - offers
        - init
        - finish

    ErrorLogModel:
      title: Модель лога для ошибки
      type: object
      properties:
        message:
          type: string
        field:
          type: string
        code:
          type: string
        level:
          type: string

    BookLog:
      title: Модель лога для книги
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        status:
          type: string
        rating:
          type: string
        reviewText:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string

    BookFilterLog:
      title: Модель лога фильтра
      properties:
        title:
          type: string
        author:
          type: string
        rating:
          type: string
        status:
          type: string

